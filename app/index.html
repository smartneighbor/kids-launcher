<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Kids TV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="home" class="screen">
    <div id="doodles"></div>
    <nav id="tabs" class="tabs">
      <div class="tab" data-tab="series">
        <svg viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3c-1.1 0-2 .89-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2zm0 14H3V8h18v12zM9 10v8l7-4z"/></svg>
        <span>Series</span>
      </div>
      <div class="tab" data-tab="movies">
        <svg viewBox="0 0 24 24"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
        <span>Films</span>
      </div>
    </nav>
    <div class="grid-area"><div id="grid" class="grid"></div></div>
    <div id="message" class="message hidden"></div>
  </div>

  <div id="player" class="screen hidden">
    <video id="video"></video>
    <div id="pause-icon" class="pause-icon hidden">
      <div class="big-button">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
    <div id="controls" class="controls hidden">
      <div id="episode-title" class="episode-title"></div>
      <div class="progress-row">
        <span id="time-current" class="time">0:00</span>
        <div id="progress" class="progress"><div id="progress-fill" class="progress-fill"><i></i></div></div>
        <span id="time-total" class="time">0:00</span>
      </div>
      <div class="buttons">
        <div id="btn-play" class="ctrl-button" data-index="0">
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div id="btn-next" class="ctrl-button wide" data-index="1">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          <span>Volgende</span>
        </div>
        <div id="btn-episodes" class="ctrl-button wide" data-index="2">
          <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          <span>Afleveringen</span>
        </div>
      </div>
    </div>
    <div id="spinner" class="spinner hidden"></div>
  </div>

  <div id="episodes" class="screen hidden">
    <img id="ep-bg" class="ep-bg" alt="">
    <div class="ep-bg-fade"></div>
    <div class="ep-header">
      <img id="ep-logo" class="ep-logo hidden" alt="">
      <div id="ep-series" class="ep-series"></div>
    </div>
    <div id="ep-seasons" class="ep-seasons"></div>
    <div id="ep-list-wrap" class="ep-list-wrap"><div id="ep-list" class="ep-list"></div></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
